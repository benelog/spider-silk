plugins {
    id 'java-library'
}

dependencies {
    api project(':spider-silk-core')

    // api, not implementation: the customizers hand out Tomcat's own types.
    // 10.1.x is the Servlet 6.0 line, the same level as core's servlet API and
    // Jetty's ee10 — Tomcat 11 would be Servlet 6.1 and a version skew for nothing.
    api 'org.apache.tomcat.embed:tomcat-embed-core:10.1.57'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
