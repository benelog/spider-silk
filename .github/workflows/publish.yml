name: Publish

on:
  push:
    branches: [ main ]
    # Listed the other way round on purpose: an ignore list fails towards
    # building, so a file type nobody thought of still gets compiled and
    # tested. Everything here is prose or the doc site's own toolchain, none
    # of which the Gradle build reads.
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - '**.md'
      - 'antora-playbook.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
