name: Release

# A version on Maven Central is permanent, so a release starts from a tag and
# never from a push to main. RELEASING.md has the steps around it.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag, the secrets, and the changelog
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
          for name in SIGNING_KEY SIGNING_PASSWORD CENTRAL_USERNAME CENTRAL_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set"
              exit 1
            fi
          done
          mkdir -p build
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: ./gradlew build

      - name: Sign every publication and bundle them
        run: |
          ./gradlew cleanStagingRepository
          ./gradlew centralBundle
          bundle="build/central-bundle-$VERSION.zip"
          if ! unzip -l "$bundle" | grep -q '\.jar\.asc$'; then
            echo "::error::$bundle carries no signatures"
            exit 1
          fi
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"

      # USER_MANAGED stops at VALIDATED: the deployment waits on the Central
      # Portal for the Publish button, which is the last look before the
      # version becomes permanent.
      - name: Upload the bundle to the Central Portal
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          id=$(curl --silent --show-error --fail-with-body -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@$BUNDLE" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=spider-silk-$VERSION&publishingType=USER_MANAGED")
          echo "Deployment $id"
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --fail-with-body -X POST \
              -H "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id")
            state=$(echo "$status" | jq -r .deploymentState)
            echo "$state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) echo "$status" | jq .; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Deployment $id was still $state after ten minutes"
          exit 1

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" --notes-file build/release-notes.md
