subprojects {
    apply plugin: 'java'

    group = 'io.github.benelog.spidersilk'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// Published to GitHub Packages: the framework and its test harness, not the example.
configure(subprojects.findAll { it.name in ['spider-silk-core', 'spider-silk-test'] }) {
    apply plugin: 'maven-publish'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = 'A thin web framework on top of the Jakarta Servlet API, with no reflection.'
                    url = 'https://github.com/benelog/spider-silk'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'benelog'
                            name = 'Sanghyuk Jung'
                            url = 'https://github.com/benelog'
                        }
                    }
                    scm {
                        url = 'https://github.com/benelog/spider-silk'
                        connection = 'scm:git:https://github.com/benelog/spider-silk.git'
                        developerConnection = 'scm:git:git@github.com:benelog/spider-silk.git'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/benelog/spider-silk')
                credentials {
                    username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                    password = project.findProperty('gpr.token') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
