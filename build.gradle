// spider-silk-gradle-plugin is an included build (see settings.gradle), not a
// subproject, so the root's lifecycle tasks would pass it by; these delegates
// keep `gradlew build`, `publishToMavenLocal`, and the publish the workflow
// runs covering it too.
apply plugin: 'base'
tasks.named('build') {
    dependsOn gradle.includedBuild('spider-silk-gradle-plugin').task(':build')
}
tasks.register('publishToMavenLocal') {
    dependsOn gradle.includedBuild('spider-silk-gradle-plugin').task(':publishToMavenLocal')
}
tasks.register('publishAllPublicationsToGitHubPackagesRepository') {
    dependsOn gradle.includedBuild('spider-silk-gradle-plugin').task(':publishAllPublicationsToGitHubPackagesRepository')
}

subprojects {
    group = 'io.github.benelog.spidersilk'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// spider-silk-maven-parent publishes a hand-written POM and compiles nothing,
// so it is the one subproject that is not a Java module.
configure(subprojects.findAll { it.name != 'spider-silk-maven-parent' }) {
    apply plugin: 'java'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// Published to GitHub Packages: the framework and its test harness, not the example.
configure(subprojects.findAll {
    it.name in ['spider-silk-core', 'spider-silk-test', 'spider-silk-tomcat',
            'spider-silk-undertow', 'spider-silk-freemarker', 'spider-silk-handlebars',
            'spider-silk-thymeleaf', 'spider-silk-ws', 'spider-silk-openapi']
}) {
    apply plugin: 'maven-publish'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    // The module name is frozen API once released: spider-silk-core owns the
    // spidersilk package, and each other module the subpackage it is named for.
    jar {
        manifest {
            attributes('Automatic-Module-Name':
                    project.name == 'spider-silk-core'
                            ? 'spidersilk'
                            : 'spidersilk.' + project.name.substring('spider-silk-'.length()))
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = 'A thin web framework on top of the Jakarta Servlet API, with no reflection.'
                    url = 'https://github.com/benelog/spider-silk'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'benelog'
                            name = 'Sanghyuk Jung'
                            url = 'https://github.com/benelog'
                        }
                    }
                    scm {
                        url = 'https://github.com/benelog/spider-silk'
                        connection = 'scm:git:https://github.com/benelog/spider-silk.git'
                        developerConnection = 'scm:git:git@github.com:benelog/spider-silk.git'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/benelog/spider-silk')
                credentials {
                    username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                    password = project.findProperty('gpr.token') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
