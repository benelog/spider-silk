// spider-silk-gradle-plugin is an included build (see settings.gradle), not a
// subproject, so the root's lifecycle tasks would pass it by; these delegates
// keep `gradlew build`, `publishToMavenLocal`, and the staging publish the
// release workflow runs covering it too.
import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'base'
    id 'net.ltgt.errorprone' version '5.1.1' apply false
}
tasks.named('build') {
    dependsOn gradle.includedBuild('spider-silk-gradle-plugin').task(':build')
}
tasks.register('publishToMavenLocal') {
    dependsOn gradle.includedBuild('spider-silk-gradle-plugin').task(':publishToMavenLocal')
}
tasks.register('publishAllPublicationsToStagingRepository') {
    dependsOn gradle.includedBuild('spider-silk-gradle-plugin').task(':publishAllPublicationsToStagingRepository')
}

// A release reaches Maven Central as one bundle: every module, the plugin, and
// the parent publish signed into this directory, and the zip of it is uploaded
// to the Central Portal as a single deployment (see RELEASING.md).
def stagingRepository = layout.buildDirectory.dir('staging-deploy')

// Run on its own, before centralBundle: nothing orders a task in this build
// against the included plugin build's publish, so one invocation could delete
// what the other has just written.
tasks.register('cleanStagingRepository', Delete) {
    delete stagingRepository
}

tasks.register('centralBundle', Zip) {
    // Resolved when the task graph is built, after the subprojects have applied maven-publish.
    dependsOn { subprojects.collectMany { it.tasks.matching { t -> t.name == 'publishAllPublicationsToStagingRepository' } } }
    dependsOn tasks.named('publishAllPublicationsToStagingRepository')
    from stagingRepository
    // Gradle writes maven-metadata.xml into a file repository, and Central
    // builds its own. A signature needs no checksums of its own either.
    exclude '**/maven-metadata.xml*', '**/*.asc.md5', '**/*.asc.sha*'
    archiveFileName = "central-bundle-${version}.zip"
    destinationDirectory = layout.buildDirectory
}

// The version is written in gradle.properties alone. The files below repeat it
// where a reader copies it from, so the build checks that each one agrees.
tasks.register('verifyVersionReferences') {
    def expected = version.toString()
    def checked = [
            'README.md',
            'manual/antora.yml',
            'manual-ko/antora.yml',
            'spider-silk-maven-parent/pom.xml',
            'skills/spider-silk/SKILL.md',
            'skills/spider-silk/references/setup.md',
            'skills/spider-silk/references/testing.md',
            '.claude-plugin/plugin.json',
            '.claude-plugin/marketplace.json',
    ].collectEntries { [(it): file(it)] }
    def patterns = [
            ~/net\.benelog\.spidersilk:spider-silk-[a-z-]+:([^'"\s]+)['"]/,
            ~/id 'net\.benelog\.spidersilk' version '([^']+)'/,
            ~/<artifactId>spider-silk-[a-z-]+<\/artifactId>\s*<version>([^<]+)<\/version>/,
            ~/project-version: (\S+)/,
            ~/"version": "([^"]+)"/,
            ~/(?m)^  version: "([^"]+)"/,
            ~/The current version is `([^`]+)`/,
    ]
    inputs.files(checked.values())
    inputs.property('version', expected)
    doLast {
        def problems = []
        checked.each { name, f ->
            def found = patterns.collectMany { p -> (f.text =~ p).collect { it[1] } }
            if (found.isEmpty()) {
                problems << "${name}: no version reference found"
            }
            found.findAll { it != expected }.unique().each {
                problems << "${name}: ${it}"
            }
        }
        if (problems) {
            throw new GradleException("Version references disagree with gradle.properties (${expected}):\n  " + problems.join('\n  '))
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyVersionReferences')
}

// The Korean manual is a second Antora component that mirrors the English one,
// so its descriptor repeats the version, the prerelease flag, and the
// attributes of manual/antora.yml. Only the name, the title, and page-lang
// differ; anything else that drifts fails the build here.
tasks.register('verifyManualAttributes') {
    def english = file('manual/antora.yml')
    def korean = file('manual-ko/antora.yml')
    inputs.files(english, korean)
    doLast {
        def shared = { File f ->
            f.readLines().findAll { line ->
                line ==~ /^(version|display_version|prerelease|start_page):.*/ ||
                        (line ==~ /^    [a-z-]+: .*/ && !(line ==~ /^    page-lang: .*/))
            }
        }
        def a = shared(english)
        def b = shared(korean)
        if (a != b) {
            throw new GradleException("manual-ko/antora.yml disagrees with manual/antora.yml:\n  " +
                    (a - b + (b - a)).join('\n  '))
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyManualAttributes')
}

subprojects {
    group = 'net.benelog.spidersilk'

    repositories {
        mavenCentral()
    }
}

// spider-silk-maven-parent publishes a hand-written POM and compiles nothing,
// so it is the one subproject that is not a Java module.
configure(subprojects.findAll { it.name != 'spider-silk-maven-parent' }) {
    apply plugin: 'java'
    apply plugin: 'net.ltgt.errorprone'

    dependencies {
        errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        // Error Prone runs inside javac on every module. Sources the build
        // generates (jte's precompiled templates carry no @Generated) are
        // not this project's to fix, so they are left out of the checks.
        options.errorprone.excludedPaths = '.*/build/generated-sources/.*'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// Published to Maven Central: the framework and its test harness, not the example.
configure(subprojects.findAll {
    it.name in ['spider-silk-core', 'spider-silk-test', 'spider-silk-tomcat',
            'spider-silk-undertow', 'spider-silk-freemarker', 'spider-silk-handlebars',
            'spider-silk-thymeleaf', 'spider-silk-jetty-websocket', 'spider-silk-openapi']
}) {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    // Nullness is part of the public signatures, so the annotations travel with
    // the API. NullAway checks them against the code at compile time.
    dependencies {
        api 'org.jspecify:jspecify:1.0.1'
        errorprone 'com.uber.nullaway:nullaway:0.14.1'
    }

    tasks.named('compileJava', JavaCompile) {
        options.errorprone {
            check('NullAway', CheckSeverity.ERROR)
            option('NullAway:OnlyNullMarked', 'true')
            option('NullAway:JSpecifyMode', 'true')
        }
    }

    // Tests pass null on purpose to check the guards, so only main code is held to it.
    tasks.withType(JavaCompile).matching { it.name != 'compileJava' }.configureEach {
        options.errorprone.disable('NullAway')
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    // The javadoc is prose: a summary sentence says what a method does and
    // what it returns, and a @param line per argument would repeat it. doclint
    // keeps checking syntax, references, and HTML; only the "missing" group,
    // which demands the tags, is off.
    tasks.withType(Javadoc).configureEach {
        options.addBooleanOption('Xdoclint:all,-missing', true)
    }

    // The module name is frozen API once released, and it is the module's package
    // root: the name on the module path and the name in an import statement are
    // the same string. spider-silk-core owns net.benelog.spidersilk, and each
    // other module the subpackage it is named for, with a hyphen in the project
    // name standing for the package separator it reads as —
    // spider-silk-jetty-websocket holds net.benelog.spidersilk.jetty.websocket.
    jar {
        manifest {
            attributes('Automatic-Module-Name':
                    project.name == 'spider-silk-core'
                            ? 'net.benelog.spidersilk'
                            : 'net.benelog.spidersilk.'
                                    + project.name.substring('spider-silk-'.length())
                                            .replace('-', '.'))
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = 'A thin web framework on top of the Jakarta Servlet API, with no reflection.'
                    url = 'https://github.com/benelog/spider-silk'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'benelog'
                            name = 'Sanghyuk Jung'
                            url = 'https://github.com/benelog'
                        }
                    }
                    scm {
                        url = 'https://github.com/benelog/spider-silk'
                        connection = 'scm:git:https://github.com/benelog/spider-silk.git'
                        developerConnection = 'scm:git:git@github.com:benelog/spider-silk.git'
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'Staging'
                url = rootProject.layout.buildDirectory.dir('staging-deploy')
            }
        }
    }

    // Central rejects an unsigned artifact. The key arrives ASCII-armored in
    // the environment, so nothing touches a keyring; without it (a local build,
    // publishToMavenLocal) the signing tasks are skipped rather than failed.
    signing {
        def signingKey = System.getenv('SIGNING_KEY')
        required = { signingKey != null }
        if (signingKey != null) {
            useInMemoryPgpKeys(signingKey, System.getenv('SIGNING_PASSWORD'))
        }
        sign publishing.publications.maven
    }
}
