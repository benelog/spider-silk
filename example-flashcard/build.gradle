buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.cloud.tools:jib-native-image-extension-gradle:0.1.0'
    }
}

plugins {
    id 'application'
    id 'gg.jte.gradle' version '3.2.4'
    id 'org.graalvm.buildtools.native' version '1.1.10'
    id 'com.google.cloud.tools.jib' version '3.5.4'
}

// Precompiles every .jte template into a Java class at build time, so the jar
// (and the native image) renders without the runtime compiler or a JDK.
// FlashcardApp's --dev flag bypasses this and hot-reloads the .jte sources.
jte {
    sourceDirectory = file('src/main/resources/jte').toPath()
    contentType = gg.jte.ContentType.Html
    generate()
    jteExtension 'gg.jte.nativeimage.NativeResourcesExtension'
}

dependencies {
    jteGenerate 'gg.jte:jte-native-resources:3.2.4'

    implementation project(':spider-silk-core')
    implementation 'org.springframework:spring-jdbc:6.2.19'
    implementation 'com.h2database:h2:2.3.232'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation project(':spider-silk-test')
    testImplementation project(':spider-silk-tomcat')
    testImplementation project(':spider-silk-undertow')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'flashcard.FlashcardApp'
}

// The root build already compiles with --release 21; this restates it where
// Jib looks when checking the app against the JRE 21 base image below.
java {
    targetCompatibility = JavaVersion.VERSION_21
}

// `gradle nativeCompile` builds build/native/nativeCompile/flashcard with GraalVM.
// The jte plugin above already emits the reflection config for the precompiled
// template classes; what is declared here is the rest: the resources the app
// reads from the classpath, and the reachability metadata for H2 that the
// plugin downloads from the shared repository.
graalvmNative {
    binaries {
        main {
            imageName = 'flashcard'
            buildArgs.add('--no-fallback')
            resources.includedPatterns.addAll(['schema\\.sql', 'public/.*'])
        }
    }
    metadataRepository {
        enabled = true
    }
}

// `gradle jibBuildTar` wraps the app in a container image without a Docker
// daemon: build/jib-image.tar is `docker load` material for any machine, and
// `gradle jib` pushes the same image straight to a registry given credentials.
// The default is a JVM image, the jar's dependencies and classes layered onto
// a JRE base. `-Pnative` swaps that for the binary above, tagged :native — the
// extension replaces the Java layers with the single binary and points the
// entrypoint at /app/flashcard, and distroless/base supplies the glibc the
// dynamically linked binary expects. Either way H2 writes to the process home
// (/root/db in the container), so the data lives and dies with the container
// unless a volume is mounted there.
jib {
    from {
        image = 'eclipse-temurin:21-jre'
    }
    to {
        image = 'ghcr.io/benelog/spider-silk-flashcard'
    }
    container {
        ports = ['8080']
    }
}

if (providers.gradleProperty('native').present) {
    jib {
        from.image = 'gcr.io/distroless/base-debian12'
        to.image = 'ghcr.io/benelog/spider-silk-flashcard:native'
        pluginExtensions {
            pluginExtension {
                implementation = 'com.google.cloud.tools.jib.gradle.extension.nativeimage.JibNativeImageExtension'
                properties = [imageName: 'flashcard']
            }
        }
    }
    // The extension reads the binary when the image is assembled but declares
    // no task dependency on the compile that produces it.
    ['jib', 'jibBuildTar', 'jibDockerBuild'].each { taskName ->
        tasks.named(taskName) { dependsOn tasks.named('nativeCompile') }
    }
}

// The repositories map rows with spring-jdbc's DataClassRowMapper, which
// constructs the domain records reflectively, so a native image needs every
// type in flashcard.domain registered for reflection. Deriving that list from
// the source directory means a record added to the package cannot be forgotten.
def domainReflectConfig = tasks.register('domainReflectConfig') {
    def domainDir = file('src/main/java/flashcard/domain')
    def outDir = layout.buildDirectory.dir('generated/reflect-config')
    inputs.dir(domainDir)
    outputs.dir(outDir)
    doLast {
        def entries = domainDir.listFiles()
                .findAll { it.name.endsWith('.java') }
                .collect { 'flashcard.domain.' + it.name.replace('.java', '') }
                .sort()
                .collect { ['name': it, 'allDeclaredConstructors': true,
                            'allDeclaredMethods': true, 'allDeclaredFields': true] }
        def json = outDir.get().file('META-INF/native-image/flashcard-domain/reflect-config.json').asFile
        json.parentFile.mkdirs()
        json.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries))
    }
}
sourceSets.main.resources.srcDir(domainReflectConfig)
