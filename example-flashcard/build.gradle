plugins {
    id 'io.github.benelog.spidersilk'
}

// The spider-silk plugin (an included build here, a published plugin for an
// application) carries the packaging every app would otherwise repeat:
// precompiled jte with its native-image resources, Jib on a JRE 21 base with
// the targetCompatibility restated where Jib checks it, the -Pnative switch
// that re-aims the same Jib tasks at the GraalVM binary, and the
// resolveDependencies task the Dockerfile's warm-up layer runs. What remains
// below is this application's own.
spiderSilk {
    jte()
}

dependencies {
    implementation project(':spider-silk-core')
    implementation 'org.springframework:spring-jdbc:6.2.19'
    implementation 'com.h2database:h2:2.4.240'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation project(':spider-silk-test')
    testImplementation project(':spider-silk-tomcat')
    testImplementation project(':spider-silk-undertow')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'flashcard.FlashcardApp'
}

// `gradle jibBuildTar` wraps the app in a container image without a Docker
// daemon, and `gradle jib` pushes it to the registry given credentials; with
// -Pnative the same tasks ship the GraalVM binary instead, tagged :native.
// Either way H2 writes to the process home (/root/db in the container), so
// the data lives and dies with the container unless a volume is mounted there.
jib {
    to {
        image = 'ghcr.io/benelog/spider-silk-flashcard'
    }
}

// `gradle nativeCompile` builds build/native/nativeCompile/flashcard.
// The jte wiring above already emits the reflection config for the precompiled
// template classes; what is declared here is the rest: the resources the app
// reads from the classpath, and H2's reachability metadata coming from the
// shared repository the plugin enables.
graalvmNative {
    binaries {
        main {
            imageName = 'flashcard'
            resources.includedPatterns.addAll(['schema\\.sql', 'public/.*'])
        }
    }
}

// The repositories map rows with spring-jdbc's DataClassRowMapper, which
// constructs the domain records reflectively, so a native image needs every
// type in flashcard.domain registered for reflection. Deriving that list from
// the source directory means a record added to the package cannot be forgotten.
// This stays out of the plugin on purpose: it is the price of this app's
// choice of row mapper, not packaging every app shares.
def domainReflectConfig = tasks.register('domainReflectConfig') {
    def domainDir = file('src/main/java/flashcard/domain')
    def outDir = layout.buildDirectory.dir('generated/reflect-config')
    inputs.dir(domainDir)
    outputs.dir(outDir)
    doLast {
        def entries = domainDir.listFiles()
                .findAll { it.name.endsWith('.java') }
                .collect { 'flashcard.domain.' + it.name.replace('.java', '') }
                .sort()
                .collect { ['name': it, 'allDeclaredConstructors': true,
                            'allDeclaredMethods': true, 'allDeclaredFields': true] }
        def json = outDir.get().file('META-INF/native-image/flashcard-domain/reflect-config.json').asFile
        json.parentFile.mkdirs()
        json.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries))
    }
}
sourceSets.main.resources.srcDir(domainReflectConfig)
