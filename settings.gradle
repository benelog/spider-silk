// The Gradle plugin is its own build, included here so example-flashcard can
// apply it by id the way a published application would.
pluginManagement {
    includeBuild 'spider-silk-gradle-plugin'
}

rootProject.name = 'spider-silk'

include 'spider-silk-core'
include 'spider-silk-test'
include 'spider-silk-tomcat'
include 'spider-silk-undertow'
include 'spider-silk-freemarker'
include 'spider-silk-handlebars'
include 'spider-silk-thymeleaf'
include 'spider-silk-ws'
include 'example-flashcard'
include 'spider-silk-maven-parent'
