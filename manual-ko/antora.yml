# The Korean manual: the component `ko`, mirroring manual/ page for page.
# version, display_version, and prerelease say what manual/antora.yml says,
# and the attributes below repeat its attributes; verifyVersionReferences and
# verifyManualAttributes in build.gradle fail the build when the two drift.
name: ko
title: Spider Silk 한국어
version: main
display_version: main (unreleased)
prerelease: true
start_page: index.adoc
asciidoc:
  attributes:
    page-lang: ko
    project-group: net.benelog.spidersilk
    project-version: 1.1.0
    project-repo: benelog/spider-silk
    # What the Gradle plugin pins; kept in step with spider-silk-gradle-plugin/build.gradle.
    jte-version: 3.2.4
    jib-version: 3.5.4
    jib-maven-version: 3.5.2
    graalvm-buildtools-version: 1.1.10
    source-highlighter: highlight.js
nav:
  - modules/ROOT/nav.adoc
