plugins {
    id 'java-library'
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    api 'gg.jte:jte:3.2.4'
    // The embedded server. api, not implementation: JettyServer's customizers
    // expose Jetty types. Deploying AppServlet to another container? Exclude it.
    api 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.12'

    // The harness lives in its own module now, so the production jar carries
    // no test code. Core's own tests are a consumer of it like any other.
    testImplementation project(':spider-silk-test')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
