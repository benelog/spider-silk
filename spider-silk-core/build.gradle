plugins {
    id 'java-library'
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    api 'gg.jte:jte:3.2.4'
    // The embedded server. api, not implementation: JettyServer's customizers
    // expose Jetty types. Deploying AppServlet to another container? Exclude it.
    api 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.0.38'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
