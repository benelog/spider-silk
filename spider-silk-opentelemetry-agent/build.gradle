plugins {
    id 'java-library'
}

// The OpenTelemetry Java agent release this extension is compiled and tested
// against. The extension API is published as alpha and may change between
// agent releases, so a new agent is a new line here and a test run, not an
// assumption.
def otelAgentVersion = '2.31.1'

configurations {
    // The agent jar the test attaches to a forked JVM; never on a classpath.
    otelAgent
}

dependencies {
    // compileOnly and nothing else. The agent's extension class loader rewrites
    // these references to the shaded classes inside the agent jar, so the
    // extension ships no copy of them. The advice names spider-silk-core's
    // Route, which resolves in the application's class loader the advice is
    // inlined into, so core is not shipped either.
    compileOnly "io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api:${otelAgentVersion}-alpha"
    compileOnly "io.opentelemetry.instrumentation:opentelemetry-instrumentation-api:${otelAgentVersion}"
    compileOnly project(':spider-silk-core')

    otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${otelAgentVersion}"

    testImplementation project(':spider-silk-core')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The test runs an application under the real agent with this jar as its
// extension, in a JVM of its own, and reads the spans the agent logs.
tasks.named('test', Test) {
    dependsOn tasks.named('jar')
    def extensionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def agentJar = configurations.otelAgent
    def appClasspath = sourceSets.test.runtimeClasspath
    inputs.files(agentJar)
    jvmArgumentProviders.add({
        ["-Dtest.otel.agent=${agentJar.singleFile.absolutePath}",
         "-Dtest.otel.extension=${extensionJar.get().asFile.absolutePath}",
         "-Dtest.app.classpath=${appClasspath.asPath}"]
    } as CommandLineArgumentProvider)
}
