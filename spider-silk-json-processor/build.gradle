plugins {
    id 'java-library'
}

// The processor runs inside javac and ships nothing to the application's
// runtime: the code it generates calls spider-silk-core, which the application
// already has. It recognises the jakarta.json.bind annotations by name, so it
// depends on neither at compile time either.
dependencies {
    testImplementation project(':spider-silk-core')
    testImplementation 'jakarta.json.bind:jakarta.json.bind-api:3.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
