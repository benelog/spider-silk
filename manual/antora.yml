name: ROOT
title: Spider Silk
# main is the manual as it is being written, ahead of any release. A released
# manual is a docs/x.y.z branch, which RELEASING.md cuts from the tag, and the
# site lists every one of them beside this one.
version: main
display_version: main (unreleased)
prerelease: true
start_page: index.adoc
asciidoc:
  attributes:
    page-lang: en
    project-group: net.benelog.spidersilk
    project-version: 1.1.0
    project-repo: benelog/spider-silk
    # What the Gradle plugin pins; kept in step with spider-silk-gradle-plugin/build.gradle.
    jte-version: 3.2.4
    jib-version: 3.5.4
    jib-maven-version: 3.5.2
    graalvm-buildtools-version: 1.1.10
    # The agent spider-silk-opentelemetry-agent is built and tested against; kept in step with its build.gradle.
    otel-agent-version: 2.31.1
    source-highlighter: highlight.js
nav:
  - modules/ROOT/nav.adoc
