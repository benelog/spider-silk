plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'org.graalvm.buildtools.native' version '1.1.14'
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
}

application {
    mainClass = 'benchmark.springboot.SpringBootBenchmark'
}

// With the Spring Boot plugin beside it, `nativeCompile` runs Spring's AOT
// processing first and builds build/native/nativeCompile/spring-boot-app.
graalvmNative {
    binaries {
        main {
            buildArgs.add('--no-fallback')
            // native-build.sh passes the PGO flags through -PnativeImageArgs.
            buildArgs.addAll(providers.gradleProperty('nativeImageArgs').map { it.tokenize(' ') }.orElse([]))
        }
    }
}
